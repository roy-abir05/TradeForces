      sell: 100
      cancel: 0
    price_variance_pct: 20.0
  - name: "The Sweep"
    duration_sec: 2
    target_tps: 15000
    distribution:
      buy: 100
      sell: 0
      cancel: 0
    price_variance_pct: 0.1
